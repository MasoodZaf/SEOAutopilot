[build-system]
requires=["hatchling>=1.27"]
build-backend="hatchling.build"
[project]
name="seo-autopilot-api"
version="0.1.0"
requires-python=">=3.13"
dependencies=["fastapi>=0.116,<1","uvicorn[standard]>=0.35,<1","pydantic>=2.11,<3","pydantic-settings>=2.10,<3","sqlalchemy[asyncio]>=2.0.43,<3","asyncpg>=0.30,<1","redis>=6.4,<7","structlog>=25.4,<26","dnspython>=2.8,<3","cryptography>=45,<47","httpx>=0.28,<1","pyjwt[crypto]>=2.10,<3"]
[project.optional-dependencies]
dev=["httpx>=0.28,<1","pytest>=8.4,<9","pytest-asyncio>=1.1,<2","ruff>=0.12,<1","pyright>=1.1.405,<2"]
[tool.hatch.build.targets.wheel]
packages=["app"]
[tool.ruff]
line-length=100
target-version="py313"
[tool.pytest.ini_options]
testpaths=["tests"]
