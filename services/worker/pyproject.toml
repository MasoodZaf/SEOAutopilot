[build-system]
requires=["hatchling>=1.27"]
build-backend="hatchling.build"
[project]
name="seo-autopilot-worker"
version="0.1.0"
requires-python=">=3.13"
dependencies=["pydantic>=2.11,<3","redis>=6.4,<7","structlog>=25.4,<26","asyncpg>=0.30,<1","httpx>=0.28,<1","cryptography>=45,<47","anthropic>=1.8,<2"]
[project.optional-dependencies]
dev=["pytest>=8.4,<9","pytest-asyncio>=1.1,<2","ruff>=0.12,<1","pyright>=1.1.405,<2"]
[tool.hatch.build.targets.wheel]
packages=["app"]
