# Production overlay. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml <cmd>
# Secrets come from .env (compose substitution) and .env.local / infra/local/web.env.

services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  redis:
    restart: unless-stopped

  # None of the services override DATABASE_URL any more. They read it, and the
  # worker's RELAY_DATABASE_URL, from .env.local, where it names a non-superuser
  # role. The migration role that owns the tables is a superuser and so bypasses
  # every row-level security policy; overriding the key here would put the
  # services back on it and silently switch tenant isolation off again.
  api:
    restart: unless-stopped
    volumes:
      # Read-only, and only so `app.cli.health` can see how old the newest
      # verified dump is. A backup directory that stopped being written to looks
      # exactly like a working one until it is needed.
      - ./backups:/backups:ro
      # The image bakes a copy of the migrations so it is self-describing, and
      # this shadows it with what was actually deployed. Without the mount a
      # migration-only deploy runs against the previous image's copy and reports
      # "0 pending" -- which is indistinguishable from being up to date, and is
      # the worst possible way to be wrong about a schema.
      - ./infra/migrations:/app/migrations:ro

  worker:
    restart: unless-stopped

  crawler:
    restart: unless-stopped

  web:
    restart: unless-stopped
    build:
      args:
        NEXT_PUBLIC_APP_URL: https://${DOMAIN}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    # env_file (not environment:) so the bcrypt hash's $ characters are
    # passed through literally instead of being read as compose variables.
    env_file: [infra/local/caddy.env]
    volumes:
      # The DIRECTORY, not the file. A single-file bind mount pins the
      # container to one inode, and almost every way of editing a file --
      # sed -i, an editor's atomic save, a deploy that copies over it --
      # writes a new inode and renames it into place. The container then
      # keeps serving the old contents forever, while `cat` on the host
      # shows the new ones and `caddy reload` reports success reloading
      # the old ones. That happened here on 2026-09-20: a BidLenz vhost
      # and the network attachment it needed were added together, only
      # the network took effect, and seo.oryxenlabs.com served the other
      # application for a day. Google's reviewer found it, not us.
      #
      # Mounting the directory means an edit is visible immediately and
      # `caddy reload` is enough. Read-only is safe: Caddy writes
      # certificates to /data and its autosave to /config, never here.
      - ./infra/caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web, api]
    networks:
      - default
      # Declared, because it is load-bearing: bidlenz.oryxenlabs.com is a
      # vhost here, and its upstreams live on that project's network. It
      # used to be attached by hand, which meant every `up --force-recreate`
      # of this container silently took BidLenz off the air until somebody
      # ran `docker network connect` again from memory.
      - bidlenz

networks:
  # External on purpose: this overlay only runs on the host that also runs
  # BidLenz. Anywhere else it fails at once with "network bidlenz_default
  # not found", which is a far better outcome than starting and serving
  # a 502 for one of the two sites.
  bidlenz:
    external: true
    name: bidlenz_default

volumes:
  caddy-data:
  caddy-config:
